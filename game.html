<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trắc Nghiệm Tình Huống</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="shell">
    <section class="card game-card">
      <div class="game-header">
        <div class="user-chip">
          Thí sinh: <span id="playerNameDisplay" class="user-name">Đang tải...</span>
        </div>
        <div id="trackBadge" class="badge">CHUYÊN NGÀNH</div>
      </div>

      <div class="topline">
        <span>Tiến độ câu hỏi</span>
        <span id="counter" class="counter-badge">1/7</span>
      </div>
      <div class="progress"><i id="bar"></i></div>

      <div class="question-box">
        <h2 id="question">Đang tải câu hỏi...</h2>
      </div>

      <div id="answers" class="answers"></div>
    </section>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
